<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GTA:relive</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
  canvas#c{display:block;width:100%;height:100%}
  #load{position:fixed;inset:0;background:#0b0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 22px system-ui,Segoe UI,Arial,sans-serif;color:#fff;z-index:20;gap:10px;text-align:center;padding:20px}
  #load small{font-size:13px;opacity:.6;font-weight:400}
</style>
</head>
<body>
<div id="load">Loading San Andreas...<small>downloading the map</small></div>
<canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
  const fail = m => { const l = document.getElementById('load'); if (l) l.innerHTML = m; };
  function hasWebGL(){try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){return false;}}
  window.addEventListener('error', e => fail('Error: ' + e.message + '<small>Try reloading, or a recent Chrome, Edge or Firefox.</small>'));
  window.addEventListener('unhandledrejection', e => fail('Error: ' + ((e.reason && e.reason.message) || e.reason) + '<small>Try reloading.</small>'));
  if (!hasWebGL()) fail('This game needs WebGL (3D graphics).<small>Turn on hardware acceleration in your browser settings, or try Chrome, Edge or Firefox.</small>');
  else await import('./sa.js?v=1795620585');
</script>
</body>
</html>
